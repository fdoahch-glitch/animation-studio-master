name: Windows desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot installation
        shell: pwsh
        run: |
          godot --version
          if (-not (Test-Path "$env:APPDATA\Godot\export_templates\4.3.stable")) {
            throw "Godot 4.3 export templates were not installed."
          }

      - name: Import project resources
        shell: pwsh
        run: |
          $godotExe = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64.exe"
          if (-not (Test-Path $godotExe)) { throw "Godot executable not found: $godotExe" }
          $importProcess = Start-Process -FilePath $godotExe -ArgumentList @("--headless", "--editor", "--path", ".", "--quit") -Wait -PassThru
          if ($importProcess.ExitCode -ne 0) { throw "Godot import failed with exit code $($importProcess.ExitCode)" }

      - name: Export Windows x64 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $godotExe = Join-Path $env:USERPROFILE "godot/Godot_v4.3-stable_win64.exe"
          if (-not (Test-Path $godotExe)) { throw "Godot executable not found: $godotExe" }
          $exportProcess = Start-Process -FilePath $godotExe -ArgumentList '--headless --verbose --path . --export-release "Windows Desktop" "build/AnimationStudioMaster.exe"' -Wait -PassThru -RedirectStandardOutput "build/godot-export.stdout.log" -RedirectStandardError "build/godot-export.stderr.log"
          if (Test-Path "build/godot-export.stdout.log") { Get-Content "build/godot-export.stdout.log" | ForEach-Object { Write-Host $_ } }
          if (Test-Path "build/godot-export.stderr.log") { Get-Content "build/godot-export.stderr.log" | ForEach-Object { Write-Host $_ } }
          if ($exportProcess.ExitCode -ne 0) {
            throw "Godot export command failed with exit code $($exportProcess.ExitCode)"
          }
          Get-ChildItem -Force build | Format-Table Name, Length
          if (-not (Test-Path "build/AnimationStudioMaster.exe")) {
            throw "Godot finished without producing AnimationStudioMaster.exe"
          }
          $size = (Get-Item "build/AnimationStudioMaster.exe").Length
          if ($size -lt 100000) {
            throw "The generated executable is unexpectedly small ($size bytes)."
          }
          Write-Host "Executable created: $size bytes"

      - name: Package Windows download
        shell: pwsh
        run: |
          Compress-Archive -Path "build/AnimationStudioMaster.exe" -DestinationPath "build/AnimationStudioMaster-Windows-x64.zip" -Force
          if (-not (Test-Path "build/AnimationStudioMaster-Windows-x64.zip")) {
            throw "Windows ZIP package was not created."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "installer\AnimationStudioMaster.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "build\AnimationStudioMaster-Setup-x64.exe")) { throw "Installer executable was not generated." }

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installDir = Join-Path $PWD "build\installer-smoke-test"
          $installer = Join-Path $PWD "build\AnimationStudioMaster-Setup-x64.exe"
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installation failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $installDir "AnimationStudioMaster.exe"
          if (-not (Test-Path $installedExe)) { throw "The installer did not place the application executable." }
          $launch = Start-Process -FilePath $installedExe -ArgumentList @("--headless", "--quit-after", "3") -Wait -PassThru
          if ($launch.ExitCode -ne 0) { throw "Installed application failed headless startup with exit code $($launch.ExitCode)" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $remove = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($remove.ExitCode)" }
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AnimationStudioMaster-Windows-x64
          path: |
            build/AnimationStudioMaster.exe
            build/AnimationStudioMaster-Windows-x64.zip
            build/AnimationStudioMaster-Setup-x64.exe
            build/AnimationStudioMaster-Setup-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish downloadable Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Animation Studio Master — Windows build ${{ github.run_number }}
          body: |
            Compilación automática de Windows x64 generada desde la rama main.

            Descarga AnimationStudioMaster-Setup-x64.exe para instalar, AnimationStudioMaster-Windows-x64.zip para uso portable o AnimationStudioMaster.exe para ejecución directa. El instalador no está firmado digitalmente.
          prerelease: true
          files: |
            build/AnimationStudioMaster.exe
            build/AnimationStudioMaster-Windows-x64.zip
