name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Run project headlessly
        run: godot --headless --path . --quit-after 3
      - name: Test character rig pipeline
        run: godot --headless --path . --script res://tests/test_character_rig.gd
      - name: Test scene composition model
        run: godot --headless --path . --script res://tests/test_scene_composition.gd
      - name: Test project document persistence
        run: godot --headless --path . --script res://tests/test_project_document.gd
      - name: Test project document persistence
        run: godot --headless --path . --script res://tests/test_project_document.gd
