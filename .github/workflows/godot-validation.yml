name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Run project headlessly
        run: godot --headless --path . --quit-after 3
      - name: Test character rig pipeline
        id: character_rig
        timeout-minutes: 8
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_character_rig.gd
      - name: Test scene composition model
        run: godot --headless --path . --script res://tests/test_scene_composition.gd
      - name: Test project document persistence
        run: godot --headless --path . --script res://tests/test_project_document.gd
      - name: Test interactive scene canvas
        run: godot --headless --path . --script res://tests/test_scene_canvas.gd
      - name: Test resource library
        run: godot --headless --path . --script res://tests/test_resource_library.gd
      - name: Test scene animation tracks
        run: godot --headless --path . --script res://tests/test_timeline_tracks.gd
      - name: Test spatial rigs and retargeting
        run: godot --headless --path . --script res://tests/test_spatial_retargeting.gd

      - name: Test environment and weather director
        run: godot --headless --path . --script res://tests/test_environment_director.gd
      - name: Test dialogue and dubbing model
        run: godot --headless --path . --script res://tests/test_dialogue_studio.gd

      - name: Test portable project bundle
        run: godot --headless --path . --script res://tests/test_project_bundle.gd
      - name: Test performance auditor
        run: godot --headless --path . --script res://tests/test_performance_auditor.gd
      - name: Report character rig pipeline result
        if: always() && steps.character_rig.outcome != 'success'
        run: |
          echo "Character rig pipeline did not complete successfully (outcome: ${{ steps.character_rig.outcome }})." >&2
          exit 1
