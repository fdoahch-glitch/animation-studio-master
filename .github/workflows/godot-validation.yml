name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import and parse project
        id: parse
        timeout-minutes: 4
        continue-on-error: true
        run: godot --headless --editor --path . --quit

      - name: Run project headlessly
        id: launch
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --quit-after 3

      - name: Test character rig pipeline
        id: character_rig
        timeout-minutes: 8
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_character_rig.gd

      - name: Test character image preparation
        id: character_image_processor
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_character_image_processor.gd

      - name: Test scene composition model
        id: scene_composition
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_scene_composition.gd

      - name: Test project document persistence
        id: project_document
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_project_document.gd

      - name: Test interactive scene canvas
        id: scene_canvas
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_scene_canvas.gd

      - name: Test resource library
        id: resource_library
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_resource_library.gd

      - name: Test runtime GLB preview
        id: resource_model_preview
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_resource_model_preview.gd

      - name: Test audiovisual multipiste timeline
        id: video_timeline
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_video_timeline.gd

      - name: Test visual video timeline interactions
        id: video_timeline_view
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_video_timeline_view.gd

      - name: Test scene animation tracks
        id: timeline_tracks
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_timeline_tracks.gd

      - name: Test spatial rigs and retargeting
        id: spatial_retargeting
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_spatial_retargeting.gd

      - name: Test environment and weather director
        id: environment_director
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_environment_director.gd

      - name: Test dialogue and dubbing model
        id: dialogue_studio
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_dialogue_studio.gd

      - name: Test portable project bundle
        id: project_bundle
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_project_bundle.gd

      - name: Test performance auditor
        id: performance_auditor
        timeout-minutes: 3
        continue-on-error: true
        run: godot --headless --path . --script res://tests/test_performance_auditor.gd

      - name: Summarize validation results
        if: always()
        env:
          PARSE: ${{ steps.parse.outcome }}
          LAUNCH: ${{ steps.launch.outcome }}
          CHARACTER_RIG: ${{ steps.character_rig.outcome }}
          CHARACTER_IMAGE_PROCESSOR: ${{ steps.character_image_processor.outcome }}
          SCENE_COMPOSITION: ${{ steps.scene_composition.outcome }}
          PROJECT_DOCUMENT: ${{ steps.project_document.outcome }}
          SCENE_CANVAS: ${{ steps.scene_canvas.outcome }}
          RESOURCE_LIBRARY: ${{ steps.resource_library.outcome }}
          RESOURCE_MODEL_PREVIEW: ${{ steps.resource_model_preview.outcome }}
          TIMELINE_TRACKS: ${{ steps.timeline_tracks.outcome }}
          VIDEO_TIMELINE: ${{ steps.video_timeline.outcome }}
          VIDEO_TIMELINE_VIEW: ${{ steps.video_timeline_view.outcome }}
          SPATIAL_RETARGETING: ${{ steps.spatial_retargeting.outcome }}
          ENVIRONMENT_DIRECTOR: ${{ steps.environment_director.outcome }}
          DIALOGUE_STUDIO: ${{ steps.dialogue_studio.outcome }}
          PROJECT_BUNDLE: ${{ steps.project_bundle.outcome }}
          PERFORMANCE_AUDITOR: ${{ steps.performance_auditor.outcome }}
        run: |
          failed=0
          for check in PARSE LAUNCH CHARACTER_RIG CHARACTER_IMAGE_PROCESSOR SCENE_COMPOSITION PROJECT_DOCUMENT SCENE_CANVAS RESOURCE_LIBRARY RESOURCE_MODEL_PREVIEW TIMELINE_TRACKS VIDEO_TIMELINE VIDEO_TIMELINE_VIEW SPATIAL_RETARGETING ENVIRONMENT_DIRECTOR DIALOGUE_STUDIO PROJECT_BUNDLE PERFORMANCE_AUDITOR; do
            value="${!check}"
            echo "${check}: ${value}"
            if [ "${value}" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more validation checks failed or timed out." >&2
            exit 1
          fi
